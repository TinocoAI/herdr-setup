# SCP Explorer — open a file explorer for the SSH session in the focused pane (MobaXterm-style)
[[keys.command]]
key = "prefix+f"
type = "plugin_action"
command = "scp-explorer.open"
description = "open SCP file explorer for the SSH session in this pane"

[[keys.command]]
key = "prefix+shift+r"
type = "plugin_action"
command = "herdr-agent-quota.refresh"
description = "refresh all agent quotas"

# Herdr Remote Bridge — Option+r on macOS
[[keys.command]]
key = "prefix+alt+r"
type = "plugin_action"
command = "herdr-remote-bridge.connect"
description = "wait for a browser-only remote SSH bridge"

# Alias sem Option, mais fiável em terminais macOS
[[keys.command]]
key = "prefix+shift+e"
type = "plugin_action"
command = "herdr-remote-bridge.connect"
description = "wait for a browser-only remote SSH bridge"
