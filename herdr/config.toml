onboarding = false
[ui]
pane_borders = true
agent_panel_sort = "priority"

show_agent_labels_on_pane_borders = true

[ui.sidebar.agents]
row_gap = 1 # herdr-agent-quota
rows = [["state_icon", "tab", { token = "$quota_provider_model", bold = true, dim = false }], [{ token = "$quota_topic", dim = false }], [{ token = "$quota_cache", fg = "#9aa7b8", bold = true, dim = false }, { token = "$quota_cache_ttl", fg = "#9aa7b8", bold = true, dim = false }, { token = "$quota_error", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_context", fg = "#9aa7b8", bold = true, dim = false }], [{ token = "$quota_5h_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_5h_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_5h_danger", fg = "#ca6470", bold = true, dim = false }, { token = "$quota_week_normal", fg = "#84b084", bold = true, dim = false }, { token = "$quota_week_warning", fg = "#cdaa65", bold = true, dim = false }, { token = "$quota_week_danger", fg = "#ca6470", bold = true, dim = false }], [{ token = "$quota_credits", fg = "#b59ad6", bold = true, dim = false }, { token = "$quota_credits_pct", fg = "#b59ad6", bold = true, dim = false }]]
[theme]
name = "gruvbox"
auto_switch = false

[[keys.command]]
key = "prefix+a"
type = "plugin_action"
command = "live-sync-panes.broadcast"
description = "broadcast a command to all panes in this tab"

[[keys.command]]
key = "prefix+y"
type = "plugin_action"
command = "live-sync-panes.sync"
description = "live-sync keystrokes to all panes in this tab"




# herdr-mirror keybindings
[[keys.command]]
key = "prefix+shift+m"
type = "plugin_action"
command = "mirror.start"
description = "Mirror: start / resume daemon"

[[keys.command]]
key = "prefix+shift+s"
type = "plugin_action"
command = "mirror.pause"
description = "Mirror: pause syncing"

[[keys.command]]
key = "prefix+shift+b"
type = "plugin_action"
command = "mirror.restore"
description = "Mirror: restore closed mirrors"

[[keys.command]]
key = "prefix+alt+d"
type = "plugin_action"
command = "mirror.teardown"
description = "Mirror: teardown all mirrors"

[[keys.command]]
key = "prefix+alt+h"
type = "plugin_action"
command = "mirror.hide"
description = "Mirror: hide a host's mirrors"

[[keys.command]]
key = "prefix+alt+shift+h"
type = "plugin_action"
command = "mirror.show"
description = "Mirror: show a host's mirrors"

[[keys.command]]
key = "prefix+shift+n"
type = "plugin_action"
command = "mirror.new-workspace-pick"
description = "Mirror: new workspace — pick host"

[[keys.command]]
key = "prefix+alt+n"
type = "plugin_action"
command = "mirror.remote-new-workspace"
description = "Mirror: new workspace on remote"

[[keys.command]]
key = "prefix+alt+c"
type = "plugin_action"
command = "mirror.remote-new-tab"
description = "Mirror: new tab on remote"

[[keys.command]]
key = "prefix+alt+v"
type = "plugin_action"
command = "mirror.remote-split-right"
description = "Mirror: split right on remote"

[[keys.command]]
key = "prefix+alt+minus"
type = "plugin_action"
command = "mirror.remote-split-down"
description = "Mirror: split down on remote"

